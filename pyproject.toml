[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-triage-assistant"
version = "0.1.0"
description = "Local, explainable production defect triage assistant MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.100,<3",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
